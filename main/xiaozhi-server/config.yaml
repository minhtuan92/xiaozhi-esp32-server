# 在开发中，请在项目根目录创建data目录，然后在data目录创建名称为【.config.yaml】的空文件
# 然后你想修改覆盖修改什么配置，就修改【.config.yaml】文件，而不是修改【config.yaml】文件
# 系统会优先读取【data/.config.yaml】文件的配置，如果【.config.yaml】文件里的配置不存在，系统会自动去读取【config.yaml】文件的配置。
# 这样做，可以最简化配置，保护您的密钥安全。
# 如果你使用了智控台，那么以下所有配置，都不会生效，请在智控台中修改配置

# #####################################################################################
# #############################以下是服务器基本运行配置####################################
server:
  # 服务器监听地址和端口(Server listening address and port)
  ip: 0.0.0.0
  port: 8000
  # http服务的端口，用于简单OTA接口(单服务部署)，以及视觉分析接口
  http_port: 8003
  # 这个websocket配置是指ota接口向设备发送的websocket地址
  # 如果按默认的写法，ota接口会自动生成websocket地址，并输出在启动日志里，这个地址你可以直接用浏览器访问ota接口确认一下
  # 当你使用docker部署或使用公网部署(使用ssl、域名)时，不一定准确
  # 所以如果你使用docker部署时，将websocket设置成局域网地址
  # 如果你使用公网部署时，将vwebsocket设置成公网地址
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # 视觉分析接口地址
  # 向设备发送的视觉分析的接口地址
  # 如果按下面默认的写法，系统会自动生成视觉识别地址，并输出在启动日志里，这个地址你可以直接用浏览器访问确认一下
  # 当你使用docker部署或使用公网部署(使用ssl、域名)时，不一定准确
  # 所以如果你使用docker部署时，将vision_explain设置成局域网地址
  # 如果你使用公网部署时，将vision_explain设置成公网地址
  vision_explain: http://你的ip或者域名:端口号/mcp/vision/explain
  # OTA返回信息时区偏移量
  timezone_offset: +8
  # 认证配置
  auth:
    # 是否启用认证
    enabled: false
    # 白名单设备ID列表
    # 如果属于白名单内的设备，不校验token，直接放行
    allowed_devices:
      - "11:22:33:44:55:66"
 # MQTT网关配置，用于通过OTA下发到设备，根据mqtt_gateway的.env文件配置，格式为host:port
  mqtt_gateway: null
  # MQTT签名密钥，用于生成MQTT连接密码，根据mqtt_gateway的.env文件配置
  mqtt_signature_key: null
  # UDP网关配置
  udp_gateway: null
log:
  # 设置控制台输出的日志格式，时间、日志级别、标签、消息
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # 设置日志文件输出的格式，时间、日志级别、标签、消息
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # 设置日志等级：INFO、DEBUG
  log_level: INFO
  # 设置日志路径
  log_dir: tmp
  # 设置日志文件
  log_file: "server.log"
  # 设置数据文件路径
  data_dir: data

# 使用完声音文件后删除文件(Delete the sound file when you are done using it)
delete_audio: true
# High-pass filter (Hz) applied to mic audio before VAD/ASR; 0 = off. Removes low-frequency rumble.
audio_highpass_hz: 100
# 没有语音输入多久后断开连接(秒)，默认2分钟，即120秒
close_connection_no_voice_time: 120
# TTS请求超时时间(秒)
tts_timeout: 15
# 工具调用超时时间(秒)
tool_call_timeout: 30
# 开启唤醒词加速
enable_wakeup_words_response_cache: true
# 开场是否回复唤醒词
enable_greeting: true
# 说完话是否开启提示音
enable_stop_tts_notify: false
# 说完话是否开启提示音，音效地址
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# 是否启用WebSocket心跳保活机制
enable_websocket_ping: false


# TTS音频发送延迟配置
# tts_audio_send_delay: 控制音频包发送间隔
#   0: 使用精确时间控制，严格匹配音频帧率（默认，运行时按音频帧率计算）
#   > 0: 使用固定延迟（毫秒）发送，例如: 60
tts_audio_send_delay: 0

exit_commands:
  - "thoat"
  - "exit"
  - "退出"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus支持的采样率范围为[8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# 模块测试配置
wakeup_words:
  - "robot oi"
  - "hey robot"
  - "你好机器人"
# MCP接入点地址，地址格式为：ws://你的mcp接入点ip或者域名:端口号/mcp/?token=你的token
# 详细教程 https://github.com/xinnan-tech/xiaozhi-esp32-server/blob/main/docs/mcp-endpoint-integration.md
prompt: |
  You are a professional simultaneous (cabin) interpreter between Vietnamese, English, and Chinese.

  TRANSLATION MODE (default):
  - If you hear English or Chinese, translate it into Vietnamese.
  - If you hear Vietnamese, translate it into the target language (English by default; Chinese if the user said "dich sang tieng Trung" / "translate to Chinese"; English again on "dich sang tieng Anh" / "translate to English").
  - Output ONLY the translation. Do NOT greet, explain, ask questions, or repeat the original.
  - Keep translations natural, concise, and context-aware.

  COMMAND MODE:
  - If the user says "robot oi" / "hey robot", stop translating and treat the next utterance as an instruction or question for the robot; answer briefly in the user's language.
  - Return to TRANSLATION MODE when the user says "tiep tuc dich" / "resume translation".

# 默认系统提示词模板文件
prompt_template: translator-prompt.txt

# 系统错误时的回复
system_error_response: "Xin loi, toi dang ban. Vui long thu lai sau."

# 结束语prompt
end_prompt:
  enable: true # 是否开启结束语
  # 结束语
  prompt: |
    Say a short, warm goodbye in Vietnamese to end the conversation.


# 具体处理时选择的模块 (bản tinh gọn: chỉ giữ provider gọi cloud API)
selected_module:
  VAD: SileroVAD
  ASR: OpenaiASR
  LLM: OpenAILLM
  VLLM: OpenAIVLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

Intent:
  nointent:
    type: nointent
  function_call:
    type: function_call
    # plugins_func/functions: chỉ còn get_time (get_lunar); handle_exit_intent luôn được nạp
    functions: []

Memory:
  nomem:
    type: nomem

ASR:
  OpenaiASR:
    # gpt-4o-transcribe hoặc gpt-4o-mini-transcribe
    type: openai
    api_key: 你的OpenAI API密钥
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  GroqASR:
    # Whisper chạy trên Groq, API tương thích OpenAI nên dùng lại provider openai
    # model_name: whisper-large-v3-turbo (rẻ, nhanh) hoặc whisper-large-v3 (chính xác hơn)
    type: openai
    api_key: your-groq-api-key
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    # language: vi   # optional ISO code; leave unset for auto-detect (needed for vi/en/zh mix)
    temperature: 0   # reduces hallucinated text on silence
    output_dir: tmp/
  GoogleChirpASR:
    # Google Cloud Speech-to-Text v2, model chirp_3 (pip install google-auth)
    # language_codes: danh sach (vi-VN, en-US, cmn-Hans-CN) hoac ["auto"]
    type: google_chirp
    project_id: your-gcp-project-id
    location: us
    model_name: chirp_3
    language_codes: ["auto"]
    credentials_file: data/gcp-service-account.json
    output_dir: tmp/

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 800

LLM:
  # type: openai dùng cho mọi API tương thích OpenAI (OpenAI, Gemini, DeepSeek...)
  OpenAILLM:
    type: openai
    model_name: gpt-4o-mini
    url: https://api.openai.com/v1
    api_key: 你的api_key
  GeminiLLM:
    # Gemini qua endpoint tương thích OpenAI
    type: openai
    model_name: gemini-3.8-flash
    url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: 你的api_key
  GroqLLM:
    # Groq LLM qua endpoint tuong thich OpenAI (free tier, dung chung key voi GroqASR)
    type: openai
    model_name: openai/gpt-oss-120b
    url: https://api.groq.com/openai/v1
    api_key: your-groq-api-key
  DeepSeekLLM:
    type: openai
    model_name: deepseek-chat
    url: https://api.deepseek.com
    api_key: 你的deepseek key

VLLM:
  OpenAIVLLM:
    type: openai
    model_name: gpt-4o-mini
    url: https://api.openai.com/v1
    api_key: 你的api_key

TTS:
  SilentTTS:
    # No speaker: no audio is generated or sent, only [DICH] is logged; the device never enters the speaking state
    type: silent
    output_dir: tmp/
  EdgeTTS:
    type: edge
    voice: vi-VN-HoaiMyNeural
    output_dir: tmp/
  OpenAITTS:
    type: openai
    api_key: 你的openai api key
    api_url: https://api.openai.com/v1/audio/speech
    model: tts-1
    voice: onyx
    speed: 1
    output_dir: tmp/
